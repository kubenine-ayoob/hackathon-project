name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: terraform init


      - name: Create ECR repos
        run: |
          terraform apply -auto-approve \
            -var-file=envs/dev.tfvars \
            -target=module.kms \
            -target=module.ecr


      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PREFIX: hackthon-k9-intern-alice
          SHA: ${{ github.sha }}
        run: |
          for svc in main-backend extractor parser; do
            IMAGE="$REGISTRY/$PREFIX-$svc"
            docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" "../$svc"
            docker push "$IMAGE:$SHA"
            docker push "$IMAGE:latest"
          done


      - name: Terraform apply
        env:
          SHA: ${{ github.sha }}
        run: |
          terraform apply -auto-approve \
            -var-file=envs/dev.tfvars \
            -var "image_tags={main-backend=\"$SHA\",extractor=\"$SHA\",parser=\"$SHA\"}"

      - name: Show outputs
        run: terraform output
